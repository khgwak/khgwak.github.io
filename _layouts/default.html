<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body class="theme-base-0d">

    <div class="wrap">
      <div class="masthead">
        <div class="container masthead-inner">
          <h3 class="masthead-title">
            <a href="{{ site.baseurl }}/" title="About">{{ site.title }}</a>
            <small>{{ site.tagline }}</small>
          </h3>
          <nav class="masthead-nav">
            <a{% if page.title == 'About' %} class="active"{% endif %} href="{{ '/' | absolute_url }}">About</a>
            <a{% if page.title == 'News' %} class="active"{% endif %} href="{{ '/news/' | absolute_url }}">News</a>
          </nav>
        </div>
      </div>

      <div class="container content">
        {{ content }}
      </div>

      <footer class="container site-footer">
        <div class="site-footer-text">
          Copyright &copy; {{ site.time | date: '%Y' }}, {{ site.author.name }}. All rights reserved.
        </div>
      </footer>
    </div>
  </body>
</html>
